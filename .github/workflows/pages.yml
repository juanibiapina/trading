name: Publish trading review reports

on:
  push:
    branches: [main]
    paths:
      - "reports/**"
      - "log/**"
      - "scripts/generate-html-report.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build report site
        run: |
          # Rebuild the seven newest dated logs. Building only the newest one dropped the
          # previous day's report as soon as the morning scans created today's log.
          for day in $(ls -d log/20??-??-?? | xargs -n1 basename | sort -r | head -7); do
            if [ -f "log/$day/log.md" ]; then
              python3 scripts/generate-html-report.py --date "$day"
            fi
          done
          mkdir -p site
          cp -R reports log site/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trading reviews</title></head>
          <body><h1>Trading reviews</h1><p><a href="reports/index.html">Open daily reports</a></p></body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
